# Aggiornamenti di versione una volta al mese, una PR per ecosistema.
# Gli aggiornamenti di sicurezza non seguono il calendario e restano separati:
# i gruppi valgono solo per "version-updates".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      # I tipi di Node seguono la major di .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
