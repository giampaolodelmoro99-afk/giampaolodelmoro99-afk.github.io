name: Deploy su GitHub Pages

# Deploy solo manuale o su tag di versione vMAJOR.MINOR.PATCH (es. v1.2.3):
# la v1 resta online finché non si pubblica la v2 (vedi docs/DEPLOYMENT.md).
# Tag come v1.0.0-legacy, v1.0.0-rc1 o phase-NN non pubblicano.
on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tag:
    name: Verifica del tag di versione
    runs-on: ubuntu-24.04
    steps:
      - name: Solo tag vMAJOR.MINOR.PATCH
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Il tag $REF_NAME non è nel formato vMAJOR.MINOR.PATCH: deploy annullato."
            exit 1
          fi

  ci:
    name: CI completa
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      strict-lighthouse: true

  deploy:
    name: Pubblicazione
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/client
      - id: deployment
        uses: actions/deploy-pages@v5
