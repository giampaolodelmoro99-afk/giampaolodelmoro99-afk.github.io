name: Deploy su GitHub Pages

# Deploy solo manuale o su tag di release: la v1 resta online finché
# non si pubblica la v2 (vedi docs/DEPLOYMENT.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI completa
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Pubblicazione
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/client
      - id: deployment
        uses: actions/deploy-pages@v5
