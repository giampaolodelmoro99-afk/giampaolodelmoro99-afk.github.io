name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
  workflow_call:
    inputs:
      strict-lighthouse:
        description: "Lighthouse di chiusura: Performance desktop 100, mobile almeno 90 (chiusura di fase e release, ADR-0018)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_call' }}

env:
  HUSKY: "0"

jobs:
  quality:
    name: Lint, typecheck e test unitari
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Audit delle dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  build:
    name: Build e prerender
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          retention-days: 7

  prerender:
    name: HTML prerenderizzato e size-limit
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - run: npm run test:prerender
      - run: npm run size

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      HOME: /tmp
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse ${{ matrix.preset }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - run: npm run lhci:${{ matrix.preset }}${{ inputs.strict-lighthouse && ':strict' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-${{ matrix.preset }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
