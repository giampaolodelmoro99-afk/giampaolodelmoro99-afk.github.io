<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Content Security Policy (sito statico su GitHub Pages: niente header HTTP custom) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO di base -->
    <title>Gianpaolo Del Moro | Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio di Gianpaolo Del Moro, studente ITS Full Stack Developer a Pisa. Progetti in Node.js, Laravel, React , in un'interfaccia in stile Windows 95."

    <link rel="canonical" href="https://gianpaolodelmoro.it/" />

    <!-- Colore del tema (barra del browser su mobile) -->
    <meta name="theme-color" content="#008080" />

    <!-- Open Graph (anteprima link su WhatsApp, LinkedIn, Facebook...) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gianpaolodelmoro.it/" />
    <meta property="og:title" content="Gianpaolo Del Moro | Full Stack Developer" />

      property="og:description"
      content="Portfolio in stile Windows 95: progetti in Node.js, Laravel, React e PHP. Studente ITS Full Stack Developer in cerca di prima esperienza."
    />
    <meta property="og:image" content="https://gianpaolodelmoro.it/og-image.png" />
    <meta property="og:locale" content="it_IT" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gianpaolo Del Moro | Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio in stile Windows 95: progetti in Node.js, Laravel, React e PHP."
    />
    <meta name="twitter:image" content="https://gianpaolodelmoro.it/og-image.png" />
  </head>
